# local 档位：**不访问外部服务**也能起来并完成一次受支持的调用。
#
# 这里出现的仍然只是「指向环境变量的占位符」—— 环境变量设了就以环境变量为准，
# 没设才用这里的默认值。切换档位只改 profile 或环境变量，不改代码。
#
# 地址写 127.0.0.1 不写 localhost：后者要先走一次名字解析，而解析结果不保证是 IPv4 ——
# 表现是「偶发连不上」，而且只在部分机器上出现。
airouter:
  endpoint:
    shape: ${AIROUTER_ENDPOINT_SHAPE:openai}
    base-url: ${AIROUTER_ENDPOINT_BASE_URL:http://127.0.0.1:11434/v1}
    # 本机 Ollama 不校验凭证，但 openai 形态要求凭证在场，所以这里给一个占位值。
    # 它不是密钥 —— 真实密钥只存在于环境里，不进任何受跟踪文件。
    api-key: ${AIROUTER_ENDPOINT_API_KEY:local-placeholder}
    model: ${AIROUTER_ENDPOINT_MODEL:qwen2.5:0.5b}
    # 本机端点要给模型一点加载时间，比默认那 30 秒宽一些。
    request-timeout: ${AIROUTER_ENDPOINT_TIMEOUT:60s}
